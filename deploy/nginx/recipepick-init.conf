# Temporary HTTP-only config used until the Let's Encrypt certificate exists.
# Install as /etc/nginx/sites-available/recipepick during bootstrap; enable-ssl.sh
# replaces it with recipepick.conf after cert issuance.
server {
    listen 80;
    listen [::]:80;
    server_name recipepick.duckdns.org;

    # Certbot's HTTP-01 challenge (webroot).
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        include proxy_params;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:5173;
        include proxy_params;
    }
}

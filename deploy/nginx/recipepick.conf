# Install as /etc/nginx/sites-available/recipepick and enable its symlink.
server {
    listen 80;
    listen [::]:80;
    server_name recipepick.duckdns.org;

    # Keep this location available for Certbot's HTTP-01 challenge.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name recipepick.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/recipepick.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recipepick.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_read_timeout 120s;
    }
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        include proxy_params;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:5173;
        include proxy_params;
    }
}

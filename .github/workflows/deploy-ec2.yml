name: Deploy EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

# The existing CI workflow remains the quality gate. This workflow only deploys
# after its own lightweight preflight, and uses no repository credential on EC2.
concurrency:
  group: recipepick-ec2-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/recipepick_ec2
          chmod 600 ~/.ssh/recipepick_ec2
          ssh-keyscan -p "${{ secrets.EC2_PORT }}" -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Upload immutable release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_PROJECT_PATH: ${{ secrets.EC2_PROJECT_PATH }}
          RELEASE: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/recipepick_ec2 -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" \
            "echo \"deploy target: \$(hostname) user=\$(whoami)\"; mkdir -p '$EC2_PROJECT_PATH/releases/$RELEASE'"
          rsync -az --delete \
            --exclude '.git/' --exclude '.env' --exclude 'key/' --exclude 'backend/data/' \
            -e "ssh -i ~/.ssh/recipepick_ec2 -p $EC2_PORT" \
            ./ "$EC2_USER@$EC2_HOST:$EC2_PROJECT_PATH/releases/$RELEASE/"
      - name: Activate release and verify health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_PROJECT_PATH: ${{ secrets.EC2_PROJECT_PATH }}
          RELEASE: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/recipepick_ec2 -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" \
            "PROJECT_DIR='$EC2_PROJECT_PATH' RELEASE='$RELEASE' bash -x '$EC2_PROJECT_PATH/releases/$RELEASE/deploy/remote-deploy.sh'"
